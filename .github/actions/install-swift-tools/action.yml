name: Install SwiftLint
description: Install SwiftLint via Homebrew with a versioned cache key.

inputs:
  cache-version:
    description: Bump to invalidate the Homebrew cache
    required: false
    default: "v2"

runs:
  using: composite
  steps:
    - name: Cache Homebrew tools
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/Library/Caches/Homebrew
          /opt/homebrew/Cellar/swiftlint
          /opt/homebrew/bin/swiftlint
          /usr/local/Cellar/swiftlint
        key: ${{ runner.os }}-brew-swift-tools-${{ inputs.cache-version }}-${{ hashFiles('.swiftlint.yml') }}

    - name: Install SwiftLint
      shell: bash
      run: |
        set -euo pipefail
        brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
        echo "SwiftLint $(swiftlint version)"
