name: iOS

on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "Samples/iOS/**"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/ios.yml"
      - ".github/actions/**"
      - "VERSION"
      - "scripts/**"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "Samples/iOS/**"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/ios.yml"
      - ".github/actions/**"
      - "VERSION"
      - "scripts/**"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Check version sync
        run: ./scripts/check-version.sh

      - name: Install SwiftLint & SwiftFormat
        uses: ./.github/actions/install-swift-tools

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      - name: Resolve package
        run: |
          swift package resolve
          xcodebuild -list -scheme DivergeSDK-Package || xcodebuild -list

      # Prefer an Xcode that already has Simulator destinations; download is a last resort.
      # Package tests can fall back to macOS; the sample build needs a real Simulator.
      - name: Ensure iOS Simulator platform
        uses: ./.github/actions/ensure-ios-platform
        with:
          scheme: DivergeSDK-Package

      - name: Resolve package test destination
        id: pkg-dest
        uses: ./.github/actions/resolve-ios-destination
        with:
          scheme: DivergeSDK-Package
          allow-macos: "true"

      - name: Package tests
        run: |
          xcodebuild test \
            -scheme DivergeSDK-Package \
            -destination "${{ steps.pkg-dest.outputs.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Resolve sample destination
        id: sample-dest
        uses: ./.github/actions/resolve-ios-destination
        with:
          scheme: DivergeSample
          project: Samples/iOS/DivergeSample.xcodeproj

      - name: Build iOS sample
        run: |
          xcodebuild build \
            -project Samples/iOS/DivergeSample.xcodeproj \
            -scheme DivergeSample \
            -destination "${{ steps.sample-dest.outputs.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
