name: iOS

on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Samples/**"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"
      - ".github/actions/**"
      - "VERSION"
      - "scripts/**"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Samples/**"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"
      - ".github/actions/**"
      - "VERSION"
      - "scripts/**"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    # Job-scoped: a workflow-level SCHEME would also reach the uitest job, where
    # run-uitests.sh reads it as an override and loses its own DriverApp default.
    env:
      SCHEME: DivergeSDK-Package
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Check version sync
        run: ./scripts/check-version.sh

      - name: Install SwiftLint
        uses: ./.github/actions/install-swift-tools

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Resolve package
        run: |
          swift package resolve
          xcodebuild -list -scheme "$SCHEME" || xcodebuild -list

      # Prefer an Xcode that already has Simulator destinations; download is a last resort.
      # Package tests can fall back to macOS; the sample build needs a real Simulator.
      - name: Ensure iOS Simulator platform
        uses: ./.github/actions/ensure-ios-platform
        with:
          scheme: ${{ env.SCHEME }}

      - name: Resolve package test destination
        id: pkg-dest
        uses: ./.github/actions/resolve-ios-destination
        with:
          scheme: ${{ env.SCHEME }}
          allow-macos: "true"

      - name: Package tests
        run: |
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "${{ steps.pkg-dest.outputs.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Resolve sample destination
        id: sample-dest
        uses: ./.github/actions/resolve-ios-destination
        with:
          scheme: Sample
          project: Samples/iOS/Sample.xcodeproj

      - name: Build iOS sample
        run: |
          xcodebuild build \
            -project Samples/iOS/Sample.xcodeproj \
            -scheme Sample \
            -destination "${{ steps.sample-dest.outputs.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  uitest:
    name: Stand-in UITests
    needs: build-test
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Ensure iOS Simulator platform
        uses: ./.github/actions/ensure-ios-platform
        with:
          scheme: Sample
          project: Samples/iOS/Sample.xcodeproj

      - name: Resolve UITest destination
        id: dest
        uses: ./.github/actions/resolve-ios-destination
        with:
          scheme: DriverApp
          project: Tests/Standin/Driver.xcodeproj

      - name: Run stand-in UITests
        env:
          DESTINATION: ${{ steps.dest.outputs.destination }}
        run: ./Tests/Standin/run-uitests.sh
