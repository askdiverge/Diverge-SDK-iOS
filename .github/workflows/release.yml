name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ios:
    name: iOS checks
    uses: ./.github/workflows/ios.yml

  github-release:
    name: Validate & Create GitHub Release
    needs: [ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate SemVer tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-([Bb]eta|[Cc]anary)\.[0-9]+)?$ ]]; then
            echo "Invalid tag '$TAG'" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          TAG_LOWER="$(echo "$TAG" | tr '[:upper:]' '[:lower:]')"
          if [[ "$TAG_LOWER" == *beta* || "$TAG_LOWER" == *canary* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check VERSION file matches tag
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          BASE="${{ steps.meta.outputs.base_version }}"
          [[ "$FILE_VERSION" == "$BASE" ]] || { echo "VERSION mismatch"; exit 1; }

      - name: Check version sync
        run: ./scripts/check-version.sh

      - name: Require CHANGELOG entry
        run: |
          BASE="${{ steps.meta.outputs.base_version }}"
          FULL="${{ steps.meta.outputs.version }}"
          grep -Eq "^## \[($FULL|$BASE)\]" CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            See CHANGELOG.md. Prefer SemVer pins — do not track main.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
