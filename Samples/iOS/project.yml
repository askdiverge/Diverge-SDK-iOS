name: DivergeSample
options:
  bundleIdPrefix: ai.askdiverge
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  DivergeSDK:
    path: ../../
targets:
  DivergeSample:
    type: application
    platform: iOS
    sources:
      - DivergeSample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.askdiverge.sample
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: DivergeSample/Info.plist
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    dependencies:
      - package: DivergeSDK
        product: DivergeSDK
      - package: DivergeSDK
        product: DivergeSDKUI
    scheme:
      testTargets: []
