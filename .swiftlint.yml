disabled_rules:
  - todo
  - line_length
  - closure_parameter_position
  - unneeded_break_in_switch
  - switch_case_alignment
  - orphaned_doc_comment
  - large_tuple
  - function_parameter_count
  - redundant_string_enum_value
  - private_over_fileprivate
  - inclusive_language
  - switch_case_on_newline
  - static_over_final_class
  - optional_data_string_conversion

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - explicit_init
  - implicit_return
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - optional_enum_case_matching
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing

excluded:
  - .build
  - .swiftpm
  - .docc-build
  - docs-out
  - site-dist
  - Docs
  - Samples/iOS/.build
  - Samples/iOS/Sample.xcodeproj
  - Tests/Standin

cyclomatic_complexity:
  ignores_case_statements: true

# One type or one concern per file. Split by `extension` files (`ChatView+ViewModel+Send.swift`)
# or by extracting a subview / helper type before a file reaches the warning — CI lints
# `--strict`, so the warning is the effective limit. Tests carry looser thresholds in
# `Tests/.swiftlint.yml`.
file_length:
  warning: 250
  error: 400
  ignore_comment_only_lines: true

type_body_length:
  warning: 200
  error: 350

# Generous on purpose: SwiftUI `body` modifier chains and wire-decoding `switch`es are long by
# nature and read worse when chopped up. The cap is there to catch runaway functions.
function_body_length:
  warning: 60
  error: 100

type_name:
  excluded:
    - ID
    - id
    - T
    - U

identifier_name:
  min_length: 2
  max_length: 60
  allowed_symbols: ["_"]
  excluded:
    - x
    - y

nesting:
  type_level:
    warning: 3

reporter: xcode
